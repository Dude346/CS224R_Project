[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs224r-project"
version = "0.1.0"
description = "Modal and ManiSkill experiments for CS224R"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gymnasium>=0.29,<1.3",
    "mani_skill>=3.0.0b22",
    "modal>=1.4.3",
    "numpy>=1.26,<3",
    "pillow>=10,<12",
    "pygments>=2.20.0",
    "torch>=2.5,<3",
    "wandb>=0.19,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cs224r_project*"]
